[project]
name = "audio"
version = "0.1.0"
description = "Audio for the Promo"
requires-python = ">=3.15"
dependencies = ["numpy>=2.5.4"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "ty>=0.0.92",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
preview = true
target-version = "py315"
line-length = 80

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "line-too-long",
    "missing-trailing-comma",
    "missing-copyright-notice",
    "raise-vanilla-args",
]

[tool.ruff.lint.per-file-ignores]
"src/audio/__main__.py" = ["print"]

[tool.ty.environment]
python-version = "3.15"
