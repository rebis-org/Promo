<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Promo</title>
    <style>
    :root {
      --ink: #808080;
      --bright: #ffffff;
      --dim: #4a4a4a;
      --background: #000000;
      --stage: #000000;
    }
    html {
      color-scheme: dark;
    }
    body {
      margin: 0 auto;
      max-width: 72rem;
      padding: 3rem 1.5rem 2rem;
      background: var(--background);
      color: var(--ink);
      font-family: "SF Mono", ui-monospace, Menlo, monospace;
      font-size: 0.875rem;
      line-height: 1.6;
    }
    h1 {
      font-size: 1rem;
      font-weight: 400;
      color: var(--bright);
      margin: 0 0 0.25rem;
    }
    .sub {
      color: var(--dim);
      margin: 0 0 2rem;
    }
    #wrap {
      margin: 0 0 1.5rem;
    }
    #c {
      display: block;
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--stage);
      border: 1px solid var(--dim);
      cursor: pointer;
    }
    #ui {
      border-top: 1px solid var(--dim);
      padding-top: 1rem;
    }
    #marks {
      position: relative;
      height: 1rem;
      margin-bottom: 0.75rem;
    }
    .mark {
      position: absolute;
      top: 0;
      height: 0.875rem;
      border-left: 1px solid var(--bright);
      color: var(--ink);
      font-size: 0.625rem;
      overflow: hidden;
      white-space: nowrap;
      padding-left: 0.2rem;
      cursor: pointer;
    }
    .mark:hover {
      color: var(--bright);
    }
    #scrub {
      width: 100%;
      margin: 0 0 0.75rem;
      accent-color: var(--bright);
    }
    #info {
      font-size: 0.75rem;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #errs {
      display: none;
      margin: 1rem 0 0;
      padding: 0.75rem 1rem;
      border: 1px solid #ff6961;
      color: #ff6961;
      font-size: 0.75rem;
      white-space: pre-wrap;
    }
    footer {
      margin-top: 2.5rem;
      color: var(--dim);
      font-size: 0.8125rem;
    }
    footer kbd {
      font-family: inherit;
      font-size: 0.6875rem;
      border: 1px solid var(--dim);
      padding: 0.05rem 0.3rem;
    }
    /* export mode: pixel-exact canvas, no chrome (driven by ?export=1) */
    body.export {
      margin: 0;
      padding: 0;
      max-width: none;
    }
    body.export #ui,
    body.export #errs,
    body.export h1,
    body.export .sub,
    body.export footer {
      display: none;
    }
    body.export #wrap {
      margin: 0;
    }
    body.export #c {
      width: 1920px;
      height: 1080px;
      max-width: none;
      aspect-ratio: auto;
      border: 0;
      cursor: default;
    }
    </style>
  </head>
  <body>
    <h1>Promo</h1>
    <p class="sub">Code-rendered teasers</p>

    <div id="wrap"><canvas id="c"></canvas></div>

    <div id="ui">
      <div id="marks"></div>
      <input id="scrub" type="range" min="0" value="0" step="0.001">
      <div id="info"></div>
    </div>
    <pre id="errs"></pre>

    <footer>
      <kbd>space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> seek ±1 s (⇧ ±5 s) ·
      <kbd>,</kbd><kbd>.</kbd> frame · <kbd>[</kbd><kbd>]</kbd> scene ·
      <kbd>l</kbd> loop · <kbd>h</kbd> hide UI
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
